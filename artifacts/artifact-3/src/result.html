<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/compass_dark.svg">
    <link rel="stylesheet" href="style.css">
    <title>The Path is Chosen - The Fellowship Companion</title>
</head>

<body>
<main class="results-page">
    <h1 class="results-page__title">The Path is Chosen</h1>

    <article class="card card--results is-chosen result-card">
        <div class="result-card__content">
            <div class="result-card__left">
                <span class="result-card__badge">Chosen</span>
                <h2 class="result-card__route-type">Chosen Route</h2>
                <p class="result-card__route-name">Caradhras</p>
            </div>

            <div class="result-card__right">
                <strong class="result-card__votes">6 votes</strong>
                <button class="result-card__details" type="button" aria-label="Expand for details">
                    <span>Expand for details</span>
                    <svg class="result-card__details-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" />
                    </svg>
                </button>
            </div>
        </div>
    </article>

    <article class="card card--results is-lost result-card">
        <div class="result-card__content">
            <div class="result-card__left">
                <h2 class="result-card__route-type">Alternative Route</h2>
                <p class="result-card__route-name">Moria</p>
            </div>

            <div class="result-card__right">
                <strong class="result-card__votes">3 votes</strong>
                <button class="result-card__details" type="button" aria-label="Expand for details">
                    <span>Expand for details</span>
                    <svg class="result-card__details-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" />
                    </svg>
                </button>
            </div>
        </div>
    </article>

    <a href="new_voting.html" class="btn btn--secondary results-page__button" type="button">
        + Create new decision
    </a>
</main>

<!-- NAV -->
<nav class="bottomnav">
    <div class="bottomnav__inner">
        <button class="bottomnav__button is-active" type="button">
            <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/cube.svg" alt="Cube Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/map.svg" alt="Map Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/user.svg" alt="User Icon">
        </button>
    </div>
</nav>
</body>
</html>
