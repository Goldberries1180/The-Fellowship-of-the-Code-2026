<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Result</title>
</head>
 
 <style>
    .results-page {
      width: 100%;
      max-width: 390px;
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      padding: 98px 14px 40px;
      box-sizing: border-box;
    }

    .results-page__title {
      margin: 0 0 60px;
      color: #E8E3D6;
      font-family: "Inter", sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 32px;
    }

    .result-card {
      width: 347.82px;
      max-width: 100%;
      margin: 0 auto 13px;
      box-sizing: border-box;
    }

    .result-card__content {
      width: 100%;
      height: 100%;
      padding: 23px 24px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-card__left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .result-card__badge {
      display: inline-flex;
      padding: 5px 13px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: #17120C;
      color: var(--color-text);
      font-size: 12px;
      font-weight: 400;
      line-height: 14px;
    }

    .result-card__route-type {
      margin: 0 0 8px;
      color: var(--color-text);
      font-size: 19px;
      font-weight: 700;
      line-height: 24px;
    }

    .result-card__route-name {
      margin: 0;
      color: var(--color-text);
      font-size: 24px;
      font-weight: 800;
      line-height: 28px;
    }

    .result-card__right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      align-self: center;
      white-space: nowrap;
    }

    .result-card__votes {
      color: var(--color-text);
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
    }

    .result-card__details {
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--color-light-grey);
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      cursor: pointer;
    }

    .results-page__button {
      display: flex;
      width: 340px;
      max-width: 100%;
      margin: 54px auto 0;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }
  </style>
</head>

<body>
  <main class="results-page">
    <h1 class="results-page__title">Voting finished</h1>

    <article class="card card--results is-chosen result-card">
      <div class="result-card__content">
        <div class="result-card__left">
          <span class="result-card__badge">Chosen</span>
          <h2 class="result-card__route-type">Chosen Route</h2>
          <p class="result-card__route-name">Caradhras</p>
        </div>

        <div class="result-card__right">
          <strong class="result-card__votes">3 votes</strong>
          <button class="result-card__details" type="button">Details⌄</button>
        </div>
      </div>
    </article>

    <article class="card card--results is-lost result-card">
      <div class="result-card__content">
        <div class="result-card__left">
          <h2 class="result-card__route-type">Alternative Route</h2>
          <p class="result-card__route-name">Moria</p>
        </div>

        <div class="result-card__right">
          <strong class="result-card__votes">3 votes</strong>
          <button class="result-card__details" type="button">Details⌄</button>
        </div>
      </div>
    </article>

    <button class="btn btn--secondary results-page__button" type="button">
      + Create new decision
    </button>
  </main>

  <!-- NAV -->
<nav class="bottomnav">
    <button class="bottomnav__button is-active" type="button">
        <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/cube.svg" alt="Cube Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/map.svg" alt="Map Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/user.svg" alt="User Icon">
    </button>
</nav>
</body>
</html>
