<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Result</title>
</head>
<style>
    :root {
      --color-primary: #8B7355;
      --color-bg-page: #15120F;
      --color-bg-cards: #2C2416;
      --color-bg-elements: rgba(26, 22, 18, 0.80);
      --color-outline-soft: #3A3228;
      --color-text-main: #F4F0EA;
      --color-text-muted: #A99A86;
      --radius-lg-16px: 16px;
    }

    * {
      box-sizing: border-box;
    }
     body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-text-main);
    }

    .phone {
      width: 375px;
      height: 812px;
      background: var(--color-bg-page);
      position: relative;
      overflow: hidden;
    }

    .content {
      padding: 98px 14px 0;
    }

    h1 {
      margin: 0 0 60px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    .card {
      display: flex;
      padding: 1px;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
      border-radius: var(--radius-lg-16px, 16px);
      background: var(--color-bg-cards, #2C2416);
      margin-bottom: 13px;
      position: relative;
    }

    .card.chosen {
      width: 347.82px;
      height: 163.5px;
      border: 1px solid var(--color-primary, #8B7355);
    }

    .card.alternative {
      width: 347.82px;
      height: 110px;
      border: 1px solid var(--color-outline-soft, #3A3228);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      padding: 23px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      display: inline-flex;
      padding: 5px 13px;
      border-radius: 999px;
      background: #17120C;
      color: var(--color-text-main);
      font-size: 12px;
      margin-bottom: 18px;
    }

    .route-type {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .route-name {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.15;
    }

    .votes {
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 16px;
    }

    .details {
      margin-top: 8px;
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: 400;
    }

    .button-wrap {
      margin-top: 54px;
      display: flex;
      justify-content: center;
    }

    .create-button {
      display: flex;
      width: 340px;
      padding: 10px 25px;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      border: 1px solid var(--color-primary, #8B7355);
      background: var(--color-bg-elements, rgba(26, 22, 18, 0.80));
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.10),
                  0 2px 4px -2px rgba(0, 0, 0, 0.10);
      color: var(--color-primary);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #221B12;
      display: flex;
      align-items: center;
      justify-content: space-around;
      color: #B9AA92;
    }

    .nav-item {
      font-size: 22px;
      opacity: 0.9;
    }

    .nav-item.active {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(139, 115, 85, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }
  </style>
</head>

<body>
  <main class="phone">
    <section class="content">
      <h1>Voting finished</h1>

      <article class="card chosen">
        <div class="card-inner">
          <div>
            <div class="label">Chosen</div>
            <div class="route-type">Chosen Route</div>
            <div class="route-name">Moria</div>
          </div>

          <div>
            <div class="votes">3 votes</div>
            <div class="details">Details⌄</div>
          </div>
        </div>
      </article>

      <article class="card alternative">
        <div class="card-inner">
          <div>
            <div class="route-type">Alternative Route</div>
            <div class="route-name">Moria</div>
          </div>

          <div>
            <div class="votes">3 votes</div>
            <div class="details">Details⌄</div>
          </div>
        </div>
      </article>

      <div class="button-wrap">
        <button class="create-button">+ Create new decision</button>
      </div>
    </section>

    <!-- NAV -->
<nav class="bottomnav">
    <button class="bottomnav__button is-active" type="button">
        <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/cube.svg" alt="Cube Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/map.svg" alt="Map Icon">
    </button>

    <button class="bottomnav__button" type="button">
        <img src="../assets/icons/user.svg" alt="User Icon">
    </button>
</nav>
  </main>
</body>
</html>
