<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waiting for the Fellowship - The Fellowship Companion</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/compass_dark.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="route-options">

    <!-- CONTENT BLOCK (unsichtbare Card) -->
    <section class="card" style="
        background: transparent;
        border: none;
        padding: 0;
        max-width: 340px;
        margin: 40px auto;
    ">

        <h2 class="card-headline">Caradhras or Moria?</h2>

        <p class="route-sub-header">Vote initiated by Frodo</p>

        <p class="route-sub-header">
            You voted for 
            <span style="color: var(--color-primary);">Caradhras</span>
        </p>

        <p class="route-sub-header">
            Waiting for everyone to finish voting...
        </p>

        <!-- PROGRESS -->
        <div style="text-align:center; margin-top:40px;">

         <p style="
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:6px;
  font-weight:600;
  text-align:center;
">
  <span style="font-size:48px;">4</span>
  <span style="font-size:20px; color: var(--color-light-grey); font-weight:400;">of</span>
  <span style="font-size:48px;">9</span>
  <span style="font-size:20px; color: var(--color-light-grey); font-weight:400;">voted</span>
</p>
            
           <div style="
    width:60%;
    height:6px;
    background:#3A3228;
    border-radius:4px;
    margin:10px auto;
">
    <div style="
        width:44%;
        height:100%;
        background:var(--color-primary);
        border-radius:4px;
    "></div>
</div>

            <p class="route-sub-header">44% complete</p>

        </div>

        <!-- TIMER -->
        <div style="text-align:center; margin-top:30px;">
            <p class="route-sub-header">Voting will end in</p>
            <p style="font-size:20px;">00:08:22</p>
        </div>
        <a href="result.html" class="btn btn--primary">See results</a>
    </section>

</main>

<nav class="bottomnav">
    <div class="bottomnav__inner">
        <button class="bottomnav__button is-active" type="button">
            <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
        </button>
 
        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/cube.svg" alt="Cube Icon">
        </button>
 
        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/map.svg" alt="Map Icon">
        </button>
 
        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/user.svg" alt="User Icon">
        </button>
    </div>
</nav>

</body>
</html>
