<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Deciding</title>
</head>
<body>
<div class="container">
<header>

<p class="route-header">New Route Decision</p>
<p class="route-sub-header">Add route option for voting</p>

</header>
<main>
<form>
    <div class="switch-container">
        <img class="info-icon" src="../assets/icons/info_icon.svg" alt="Info to Criticality Selection" title="The vote span for critical votes is 24 hours and everyone is selected to vote">
        <input type="checkbox" id="criticality-toggle" class="switch-toggle">
        <label class="new-switch" for="criticality-toggle">
            <span class="new-switch__option new-switch__option--active">Non-Critical</span>
            <span class="new-switch__option new-switch__option--inactive">Critical</span>
        </label>
    </div>
    <div class="route-options">
        <label class="card-headline">Who should vote?</label><br>
            <div class="checkbox-grid">
                <div class="checkbox-column">
                    <label><input class=vote-select" type="checkbox" name="vote" value="Gandalf">Gandalf</label>
                    <label><input type="checkbox" name="vote" value="Frodo">Frodo</label>
                    <label><input type="checkbox" name="vote" value="Sam">Sam</label>
                    <label><input type="checkbox" name="vote" value="Aragorn">Aragorn</label>
                    <label><input type="checkbox" name="vote" value="Legolas">Legolas</label>
                </div>
                <div class="checkbox-column">
                    <label><input type="checkbox" name="vote" value="Gimli">Gimli</label>
                    <label><input type="checkbox" name="vote" value="Boromir">Boromir</label>
                    <label><input type="checkbox" name="vote" value="Pippin">Pippin</label>
                    <label><input type="checkbox" name="vote" value="Merry">Merry</label>
                </div>
            </div>
    </div>
    <div class="route-options">
    <label class="route-label">Option 1<br><input class="option_name input input--small" type="text" placeholder="Enter Route Name"></label><br>
    <label class="route-label">Known Risks<br>
        <textarea class="risks-area input input--large" placeholder="Known Risks"></textarea>
    </label><br>
    <label class="route-label">Source<br>
        <select name="source" class="source-select">
            <option value="Gandalf">Gandalf</option>
            <option value="Frodo">Frodo</option>
            <option value="Sam">Sam</option>
            <option value="Aragorn">Aragorn</option>
            <option value="Legolas">Legolas</option>
            <option value="Gimli">Gimli</option>
            <option value="Boromir">Boromir</option>
            <option value="Pippin">Pippin</option>
            <option value="Merry">Merry</option>
        </select>
    </label><br>
    </div>
<div class="route-options">
    <label class="route-label">Option 2<br>
        <input class="option_name input input--small" type="text" placeholder="Route Option 2">
    </label><br>
    <label class="route-label">Known Risks<br>
        <textarea class="risks-area input input--large" placeholder="Known Risks"></textarea>
    </label><br>
    <label class="route-label">Source<br>
        <select name="source" class="source-select">
            <option value="Gandalf">Gandalf</option>
            <option value="Frodo">Frodo</option>
            <option value="Sam">Sam</option>
            <option value="Aragorn">Aragorn</option>
            <option value="Legolas">Legolas</option>
            <option value="Gimli">Gimli</option>
            <option value="Boromir">Boromir</option>
            <option value="Pippin">Pippin</option>
            <option value="Merry">Merry</option>
        </select>
    </label><br>
</div>
    <div>
        <label class="start-vote-info">Selected group members will be notified<br></label>
        <button class="btn btn--primary" type="submit" formaction="https://youtu.be/dQw4w9WgXcQ?si=25BW-3VCnYBTk2rq" formtarget="_blank">Start vote</button>
    </div>

</form>
</main>
<nav class="bottomnav">
    <div class="bottomnav__inner">
        <div class="bottomnav__button is-active">
            <img src="../assets/icons/compass_dark.svg" alt="Decisions">
        </div>
        <div class="bottomnav__button">
            <img src="../assets/icons/cube.svg" alt="Settings">
        </div>
        <div class="bottomnav__button">
            <img src="../assets/icons/map.svg" alt="Info">
        </div>
        <div class="bottomnav__button">
            <img src="../assets/icons/user.svg" alt="User">
        </div>
    </div>
</nav>
</div>
</body>
</html>
