<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" as="image" href="../assets/images/Background_1.webp">
    <title>Voting Empty State</title>

    <link rel="stylesheet" href="style.css">

    <style>

    h1 {
        color: #E8E3D6;
        text-align: center;
        font-size: 24px;
        font-style: normal;
        font-weight: 600;
        line-height: 36px; /* 150% */
    }

p {
    width: 100%;
    max-width: 362px;
    color: #A39989;
    text-align: center;
    font-size: 16px;
    font-style: normal;
    font-weight: 400;
    line-height: 24px;
}

.icon_emptystate {
    width: 96px;
    height: 96px;
    padding: 22px;
    box-sizing: border-box;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;
    background-color: rgba(26, 22, 18, 0.8);
}

.icon_emptystate img {
    width: 52px;
    height: 52px;
    display: block;
}
  </style>

</head>

<body class="screen-empty">

    <!-- NAV -->
<nav class="bottomnav">
    <div class="bottomnav__inner">
        <button class="bottomnav__button is-active" type="button">
            <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/cube.svg" alt="Cube Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/map.svg" alt="Map Icon">
        </button>

        <button class="bottomnav__button" type="button">
            <img src="../assets/icons/user.svg" alt="User Icon">
        </button>
    </div>
</nav>

    <!-- CONTENT -->

    <div class="container">
        <div class="icon_emptystate">
            <img src="../assets/icons/compass_dark.svg" alt="Compass Icon">
        </div>
        <h1>No decisions yet</h1>
        <p>The Fellowship hasn't made any route decisions yet. Create your first decision to guide the journey through Middle Earth.</p>
        <button class="btn btn--primary">Add voting</button>
    </div>
</body>
</html>
